name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meeting-stt:
    name: Meeting STT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/meeting-stt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.12

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --dev

      - name: Test
        run: uv run pytest

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      RAGIC_PROTOCOL: https
      RAGIC_DOMAIN: example.invalid
      RAGIC_API_KEY: ci-test-key
      RAGIC_FORM_901_PATH: /demo/work-orders/line-a
      RAGIC_FORM_901_TEST_PATH: /demo/work-orders/line-a
      RAGIC_FORM_902_PATH: /demo/work-orders/line-b
      RAGIC_FORM_902_TEST_PATH: /demo/work-orders/line-b
      UPSTREAM_ACTIVITY_LOG_TEST_PATH: /demo/activity-logs
      UPSTREAM_ACTIVITY_LOG_SAVE_ACTION_BUTTON_ID: "9003"
      UPSTREAM_ACTIVITY_LOG_WORK_ORDER_FIELD_ID: "9001047"
      UPSTREAM_ACTIVITY_LOG_TYPE_FIELD_ID: "9001065"
      UPSTREAM_ACTIVITY_LOG_PROCESS_FIELD_ID: "9001033"
      UPSTREAM_ACTIVITY_LOG_DEP_FIELD_ID: "9001037"
      UPSTREAM_ACTIVITY_LOG_PROD_TYPE_FIELD_ID: "9001031"
      UPSTREAM_ACTIVITY_LOG_REMARK_FIELD_ID: "9001029"
      UPSTREAM_ACTIVITY_LOG_DATE_FIELD_ID: "9001030"
      RAGIC_SOURCE_MACHINE: /demo/reference/machines
      RAGIC_SOURCE_OPERATOR: /demo/reference/operators
      RAGIC_SOURCE_PROCESS: /demo/reference/processes
      RAGIC_WRITE_TARGET: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
